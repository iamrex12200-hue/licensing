name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render healthz
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://licensing-live.onrender.com/healthz)
          echo "healthz -> $code"
          [ "$code" = "200" ] || exit 1